name: Avaliação FSUminho AS/ESW

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validacao:
    name: 🧪 Validador SIL Trackdrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências (NumPy, SciPy, Matplotlib)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas

      - name: 🔒 Verificar Integridade de Submissão (Apenas candidatos/)
        run: |
          python tests/verificar_integridade_git.py

      - name: 🛡️ Garantir Ficheiros de Teste Oficiais (Anti-Tamper)
        if: github.ref_name != 'main'
        run: |
          git checkout origin/main -- tests/ core/ .github/

      - name: Executar Bateria de Testes Estruturais
        run: |
          python tests/verificar_estrutura.py

      - name: Executar Avaliação Estática (Headless)
        if: always()
        run: |
          python tests/avaliar_estatico.py --etapa 1 --salvar
          python tests/avaliar_estatico.py --etapa 2 --salvar
          python tests/avaliar_estatico.py --etapa 3 --salvar
          python tests/avaliar_estatico.py --etapa 4 --salvar
          python tests/avaliar_estatico.py --etapa 5 --salvar
